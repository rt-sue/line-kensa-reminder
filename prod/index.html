<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>検査日登録・変更</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    body {
      font-family: sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
      color: #333;
      background: #fff;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 18px;
      margin-top: 25px;
    }

    .qr-info {
      border: 2px solid #06c755;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
      background: #f7fff9;
    }

    .qr-info-title {
      font-weight: bold;
      color: #06c755;
      margin-bottom: 10px;
    }

    .qr-row {
      margin: 6px 0;
      line-height: 1.5;
    }

    .qr-label {
      font-weight: bold;
    }

    input[type="date"],
    input[type="time"] {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
      margin: 8px 0 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      width: 100%;
      padding: 13px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 8px;
    }

    .register-button {
      background: #06c755;
      color: white;
    }

    .change-button {
      background: #4285f4;
      color: white;
    }

    .cancel-button {
      background: #e53935;
      color: white;
      margin-top: 5px;
    }

    .date-item {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .date-text {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      background: #f1f1f1;
      white-space: pre-wrap;
    }

    .hidden {
      display: none;
    }

  </style>

</head>


<body>

  <h1>検査日を登録・変更</h1>


  <!-- ========================================
       QRから読み込んだ検査情報
       ======================================== -->

  <div
    id="qrInfo"
    class="qr-info hidden"
  >

    <div class="qr-info-title">
      QRから検査情報を読み込みました
    </div>

    <div
      id="qrExamNameRow"
      class="qr-row"
    >
      <span class="qr-label">検査：</span>
      <span id="qrExamName"></span>
    </div>

    <div class="qr-row">
      <span class="qr-label">検査日：</span>
      <span id="qrExamDate"></span>
    </div>

    <div
      id="qrExamTimeRow"
      class="qr-row"
    >
      <span class="qr-label">予約時間：</span>
      <span id="qrExamTime"></span>
    </div>

    <div
      id="qrCategoryRow"
      class="qr-row"
    >
      <span class="qr-label">カテゴリー：</span>
      <span id="qrCategory"></span>
    </div>

  </div>


  <!-- ========================================
       登録済み検査日
       ======================================== -->

  <h2>登録済みの検査日</h2>

  <div id="examDateList">
    読み込み中です…
  </div>


  <!-- ========================================
       検査日登録
       ======================================== -->

  <h2>新しい検査日を登録</h2>

  <input
    type="date"
    id="examDate"
  >

  <!-- QR情報保持用 -->
  <input
    type="hidden"
    id="examTime"
  >

  <input
    type="hidden"
    id="category"
  >

  <input
    type="hidden"
    id="examName"
  >

  <button
    class="register-button"
    onclick="registerExam()"
  >
    この検査日を登録
  </button>


  <!-- ========================================
       メッセージ
       ======================================== -->

  <div
    id="message"
    class="message hidden"
  ></div>


  <script>

    // ========================================
    // 本番設定
    // ========================================

    const LIFF_ID =
      "2011636967-x6RIKZwu";

    const GAS_URL =
      "https://script.google.com/macros/s/AKfycbxJtcX1kF2CfhTPHvoiK_aLIV6IAtUz3ypLA1V3LjEY7wdD-DYYntUUKd3WAJsC8cXR2w/exec";


    // ========================================
    // ユーザー情報
    // ========================================

    let userId = "";


    // ========================================
    // QR情報
    // ========================================

    let qrExamDate = "";
    let qrExamTime = "";
    let qrCategory = "";
    let qrExamName = "";


    // ========================================
    // 初期処理
    // ========================================

    async function main() {

      try {

        // LIFF初期化
        await liff.init({
          liffId: LIFF_ID
        });


        // LINEログイン
        if (!liff.isLoggedIn()) {

          liff.login();

          return;
        }


        // ユーザー情報取得
        const profile =
          await liff.getProfile();

        userId =
          profile.userId;


        // ----------------------------------------
        // QRパラメータ取得
        // ※LIFF init後に取得する
        // ----------------------------------------

        readQRParameters();

        applyQRParameters();


        // ----------------------------------------
        // 登録済み検査日取得
        // ----------------------------------------

        await loadExamDates();

      } catch (error) {

        console.error(error);

        showMessage(
          "エラーが発生しました。\n" +
          error.message
        );
      }

    }


    // ========================================
    // QRパラメータ取得
    // ========================================

    function readQRParameters() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      qrExamDate =
        params.get("examDate") || "";

      qrExamTime =
        params.get("examTime") || "";

      qrCategory =
        params.get("category") || "";

      qrExamName =
        params.get("examName") || "";
    }


    // ========================================
    // QRパラメータを画面へ反映
    // ========================================

    function applyQRParameters() {

      const hasQRData =
        qrExamDate ||
        qrExamTime ||
        qrCategory ||
        qrExamName;

      if (!hasQRData) {
        return;
      }


      // 日付
      if (qrExamDate) {

        document
          .getElementById("examDate")
          .value = qrExamDate;

        document
          .getElementById("qrExamDate")
          .textContent =
            formatDisplayDate(qrExamDate);
      }


      // 時間
      if (qrExamTime) {

        document
          .getElementById("examTime")
          .value =
            qrExamTime;

        document
          .getElementById("qrExamTime")
          .textContent =
            qrExamTime;

      } else {

        document
          .getElementById("qrExamTimeRow")
          .classList
          .add("hidden");
      }


      // カテゴリー
      if (qrCategory) {

        document
          .getElementById("category")
          .value =
            qrCategory;

        document
          .getElementById("qrCategory")
          .textContent =
            qrCategory;

      } else {

        document
          .getElementById("qrCategoryRow")
          .classList
          .add("hidden");
      }


      // 検査名
      if (qrExamName) {

        document
          .getElementById("examName")
          .value =
            qrExamName;

        document
          .getElementById("qrExamName")
          .textContent =
            qrExamName;

      } else {

        document
          .getElementById("qrExamNameRow")
          .classList
          .add("hidden");
      }


      // QR情報表示
      document
        .getElementById("qrInfo")
        .classList
        .remove("hidden");
    }


    // ========================================
    // 検査日一覧取得
    // ========================================

    async function loadExamDates() {

      try {

        const response =
          await fetch(
            GAS_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "text/plain;charset=utf-8"
              },

              body: JSON.stringify({
                action: "get",
                userId: userId
              })
            }
          );

        const result =
          await response.json();

        if (
          result.status !== "success"
        ) {

          throw new Error(
            result.message ||
            "検査日の取得に失敗しました。"
          );
        }

        displayExamDates(
          result.dates || []
        );

      } catch (error) {

        console.error(error);

        document
          .getElementById("examDateList")
          .textContent =
            "検査日の取得に失敗しました。";
      }
    }


    // ========================================
    // 検査日表示
    // ========================================

    function displayExamDates(
      dates
    ) {

      const container =
        document.getElementById(
          "examDateList"
        );

      container.innerHTML = "";

      if (
        !dates ||
        dates.length === 0
      ) {

        container.textContent =
          "現在登録されている検査日はありません。";

        return;
      }


      dates.forEach(
        function(date) {

          const item =
            document.createElement(
              "div"
            );

          item.className =
            "date-item";


          const dateText =
            document.createElement(
              "div"
            );

          dateText.className =
            "date-text";

          dateText.textContent =
            formatDisplayDate(date);


          // 変更ボタン
          const changeButton =
            document.createElement(
              "button"
            );

          changeButton.className =
            "change-button";

          changeButton.textContent =
            "変更";

          changeButton.onclick =
            function() {

              changeExam(date);
            };


          // 取消ボタン
          const cancelButton =
            document.createElement(
              "button"
            );

          cancelButton.className =
            "cancel-button";

          cancelButton.textContent =
            "取り消す";

          cancelButton.onclick =
            function() {

              cancelExam(date);
            };


          item.appendChild(
            dateText
          );

          item.appendChild(
            changeButton
          );

          item.appendChild(
            cancelButton
          );

          container.appendChild(
            item
          );

        }
      );
    }


    // ========================================
    // 検査日登録
    // ========================================

    async function registerExam() {

      const examDate =
        document
          .getElementById("examDate")
          .value;

      const examTime =
        document
          .getElementById("examTime")
          .value;

      const category =
        document
          .getElementById("category")
          .value;

      const examName =
        document
          .getElementById("examName")
          .value;


      if (!examDate) {

        showMessage(
          "検査日を入力してください。"
        );

        return;
      }


      try {

        const response =
          await fetch(
            GAS_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "text/plain;charset=utf-8"
              },

              body: JSON.stringify({

                action: "add",

                userId: userId,

                examDate: examDate,

                examTime: examTime,

                category: category,

                examName: examName
              })
            }
          );


        const result =
          await response.json();


        if (
          result.status === "duplicate"
        ) {

          showMessage(
            "この検査日はすでに登録されています。"
          );

          return;
        }


        if (
          result.status !== "success"
        ) {

          throw new Error(
            result.message ||
            "登録に失敗しました。"
          );
        }


        showMessage(
          "検査日を登録しました。"
        );


        // 入力欄をクリア
        document
          .getElementById("examDate")
          .value = "";


        // 一覧更新
        await loadExamDates();


      } catch (error) {

        console.error(error);

        showMessage(
          "登録に失敗しました。\n" +
          error.message
        );
      }
    }


    // ========================================
    // 検査日の変更
    // ========================================

    async function changeExam(
      oldExamDate
    ) {

      const newExamDate =
        prompt(
          "新しい検査日を入力してください。\n\n" +
          "現在：" +
          formatDisplayDate(oldExamDate),
          oldExamDate
        );


      if (!newExamDate) {
        return;
      }


      if (
        !/^\d{4}-\d{2}-\d{2}$/.test(
          newExamDate
        )
      ) {

        alert(
          "日付はYYYY-MM-DD形式で入力してください。"
        );

        return;
      }


      try {

        const response =
          await fetch(
            GAS_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "text/plain;charset=utf-8"
              },

              body: JSON.stringify({

                action: "change",

                userId: userId,

                oldExamDate:
                  oldExamDate,

                newExamDate:
                  newExamDate
              })
            }
          );


        const result =
          await response.json();


        if (
          result.status === "duplicate"
        ) {

          alert(
            "変更後の検査日はすでに登録されています。"
          );

          return;
        }


        if (
          result.status !== "success"
        ) {

          throw new Error(
            result.message ||
            "変更に失敗しました。"
          );
        }


        showMessage(
          "検査日を変更しました。"
        );


        await loadExamDates();


      } catch (error) {

        console.error(error);

        showMessage(
          "変更に失敗しました。\n" +
          error.message
        );
      }
    }


    // ========================================
    // 検査日の取消
    // ========================================

    async function cancelExam(
      examDate
    ) {

      const confirmed =
        confirm(
          "次の検査日を取り消しますか？\n\n" +
          formatDisplayDate(examDate)
        );


      if (!confirmed) {
        return;
      }


      try {

        await fetch(
          GAS_URL,
          {
            method: "POST",

            mode: "no-cors",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body: JSON.stringify({

              action: "cancel",

              userId: userId,

              examDate: examDate
            })
          }
        );


        showMessage(
          "検査日を取り消しました。"
        );


        // 少し待ってから再取得
        setTimeout(
          function() {
            loadExamDates();
          },
          500
        );


      } catch (error) {

        console.error(error);

        showMessage(
          "取り消し処理でエラーが発生しました。"
        );
      }
    }


    // ========================================
    // 日付表示
    // ========================================

    function formatDisplayDate(
      dateString
    ) {

      if (!dateString) {
        return "";
      }

      const parts =
        dateString.split("-");

      if (parts.length !== 3) {
        return dateString;
      }

      return (
        parts[0] +
        "年" +
        Number(parts[1]) +
        "月" +
        Number(parts[2]) +
        "日"
      );
    }


    // ========================================
    // メッセージ表示
    // ========================================

    function showMessage(
      text
    ) {

      const element =
        document.getElementById(
          "message"
        );

      element.textContent =
        text;

      element.classList.remove(
        "hidden"
      );
    }


    // ========================================
    // 起動
    // ========================================

    main();

  </script>

</body>

</html>
