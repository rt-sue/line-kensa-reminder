<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>検査日登録</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    body {
      font-family: sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
      background: #f7f7f7;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 25px;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input[type="date"],
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #06c755;
      color: white;
      cursor: pointer;
      margin-top: 5px;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      white-space: pre-wrap;
      display: none;
    }

    .success {
      display: block;
      background: #e8f5e9;
      color: #2e7d32;
    }

    .error {
      display: block;
      background: #ffebee;
      color: #c62828;
    }

    .info {
      display: block;
      background: #e3f2fd;
      color: #1565c0;
    }

    .date-list {
      margin-top: 10px;
      padding-left: 20px;
    }

    .date-item {
      margin-bottom: 8px;
    }

    .hidden {
      display: none;
    }

  </style>

</head>


<body>

  <h1>検査日を登録・変更</h1>


  <!-- ========================= -->
  <!-- 登録済み検査日 -->
  <!-- ========================= -->

  <div class="box">

    <h2>登録されている検査日</h2>

    <div id="examList">
      読み込み中です...
    </div>

  </div>


  <!-- ========================= -->
  <!-- 新規登録 -->
  <!-- ========================= -->

  <div class="box">

    <h2>新しい検査日を登録</h2>

    <label for="examDate">
      検査日
    </label>

    <input
      type="date"
      id="examDate"
    >

    <button
      id="registerButton"
      onclick="registerExam()"
    >
      検査日を登録する
    </button>

    <div
      id="registerMessage"
      class="message"
    ></div>

  </div>


  <!-- ========================= -->
  <!-- 検査日変更 -->
  <!-- ========================= -->

  <div
    class="box"
    id="changeBox"
  >

    <h2>検査日を変更</h2>

    <label for="changeDate">
      変更する検査日
    </label>

    <select id="changeDate">
      <option value="">
        読み込み中です...
      </option>
    </select>


    <label for="newExamDate">
      新しい検査日
    </label>

    <input
      type="date"
      id="newExamDate"
    >


    <button
      id="changeButton"
      onclick="changeExam()"
    >
      検査日を変更する
    </button>


    <div
      id="changeMessage"
      class="message"
    ></div>

  </div>


  <script>

    // ========================================
    // 設定
    // ========================================

    const LIFF_ID = "2011636967-XDwuMWl5";

    const GAS_URL =
      "https://script.google.com/macros/s/AKfycbxJtcX1kF2CfhTPHvoiK_aLIV6IAtUz3ypLA1V3LjEY7wdD-DYYntUUKd3WAJsC8cXR2w/exec";


    // ========================================
    // LINEユーザーID
    // ========================================

    let userId = "";


    // ========================================
    // 初期処理
    // ========================================

    async function main() {

      const registerMessage =
        document.getElementById("registerMessage");

      try {

        registerMessage.className = "message info";

        registerMessage.innerText =
          "LINE情報を確認しています...";


        // LIFF初期化
        await liff.init({
          liffId: LIFF_ID
        });


        // LINEログイン
        if (!liff.isLoggedIn()) {

          liff.login();

          return;
        }


        // LINEプロフィール取得
        const profile =
          await liff.getProfile();

        userId = profile.userId;


        console.log("LINE userId:", userId);


        // 登録済み検査日取得
        await loadExamDates();


        registerMessage.className =
          "message";

        registerMessage.innerText = "";


      } catch (error) {

        console.error(error);

        registerMessage.className =
          "message error";

        registerMessage.innerText =
          "初期化に失敗しました。\n\n" +
          "エラー内容：\n" +
          getErrorMessage(error);

      }

    }


    // ========================================
    // エラー内容取得
    // ========================================

    function getErrorMessage(error) {

      if (!error) {
        return "原因不明のエラーです。";
      }

      if (error.message) {
        return error.message;
      }

      try {
        return JSON.stringify(error);
      } catch (e) {
        return String(error);
      }

    }


    // ========================================
    // 登録済み検査日取得
    // ========================================

    async function loadExamDates() {

      const examList =
        document.getElementById("examList");

      const changeDate =
        document.getElementById("changeDate");


      if (!userId) {

        examList.innerText =
          "LINEユーザー情報を取得できませんでした。";

        return;
      }


      try {

        const response =
          await fetch(
            GAS_URL,
            {
              method: "POST",

              headers: {
                "Content-Type": "text/plain"
              },

              body: JSON.stringify({
                action: "get",
                userId: userId
              })
            }
          );


        const responseText =
          await response.text();


        console.log(
          "GAS response:",
          responseText
        );


        if (!responseText) {

          throw new Error(
            "GASから空の回答が返されました。"
          );

        }


        let result;

        try {

          result =
            JSON.parse(responseText);

        } catch (e) {

          throw new Error(
            "GASの回答をJSONとして読み取れませんでした。\n\n" +
            responseText
          );

        }


        console.log(
          "GAS result:",
          result
        );


        if (result.status !== "success") {

          throw new Error(
            result.message ||
            "検査日取得でエラーが発生しました。"
          );

        }


        const dates =
          Array.isArray(result.dates)
            ? result.dates
            : [];


        // ========================================
        // 検査日一覧表示
        // ========================================

        if (dates.length === 0) {

          examList.innerText =
            "現在、登録されている検査日はありません。";

        } else {

          examList.innerHTML = "";

          const ul =
            document.createElement("ul");

          ul.className = "date-list";


          dates.forEach(function(date) {

            const li =
              document.createElement("li");

            li.className = "date-item";

            li.innerText =
              formatJapaneseDate(date);

            ul.appendChild(li);

          });


          examList.appendChild(ul);

        }


        // ========================================
        // 変更用プルダウン
        // ========================================

        changeDate.innerHTML = "";


        if (dates.length === 0) {

          const option =
            document.createElement("option");

          option.value = "";

          option.textContent =
            "変更できる検査日はありません";

          changeDate.appendChild(option);

        } else {

          dates.forEach(function(date) {

            const option =
              document.createElement("option");

            option.value = date;

            option.textContent =
              formatJapaneseDate(date);

            changeDate.appendChild(option);

          });

        }


      } catch (error) {

        console.error(error);

        examList.innerText =
          "検査日の取得に失敗しました。\n\n" +
          getErrorMessage(error);

        throw error;

      }

    }


    // ========================================
    // 検査日登録
    // ========================================

    async function registerExam() {

      const examDate =
        document.getElementById("examDate").value;

      const button =
        document.getElementById("registerButton");

      const message =
        document.getElementById("registerMessage");


      // ========================================
      // 入力チェック
      // ========================================

      if (!examDate) {

        message.className =
          "message error";

        message.innerText =
          "検査日を選択してください。";

        return;

      }


      if (!userId) {

        message.className =
          "message error";

        message.innerText =
          "LINEユーザー情報を取得できません。\n" +
          "LINEからもう一度開いてください。";

        return;

      }


      // ========================================
      // ボタン無効化
      // ========================================

      button.disabled = true;

      button.innerText =
        "登録しています...";


      message.className =
        "message info";

      message.innerText =
        "検査日を登録しています...";


      try {

        console.log(
          "GASへ登録開始"
        );

        console.log({
          action: "add",
          userId: userId,
          examDate: examDate
        });


        // ========================================
        // GASへ送信
        // ========================================

        const response =
          await fetch(
            GAS_URL,
            {
              method: "POST",

              headers: {
                "Content-Type": "text/plain"
              },

              body: JSON.stringify({
                action: "add",
                userId: userId,
                examDate: examDate
              })
            }
          );


        console.log(
          "HTTP status:",
          response.status
        );


        const responseText =
          await response.text();


        console.log(
          "GAS response:",
          responseText
        );


        if (!responseText) {

          throw new Error(
            "GASから空の回答が返されました。"
          );

        }


        let result;

        try {

          result =
            JSON.parse(responseText);

        } catch (e) {

          throw new Error(
            "GASの回答をJSONとして読み取れませんでした。\n\n" +
            responseText
          );

        }


        console.log(
          "GAS result:",
          result
        );


        // ========================================
        // 登録成功
        // ========================================

        if (result.status === "success") {

          message.className =
            "message success";

          message.innerText =
            "検査日を登録しました。\n\n" +
            formatJapaneseDate(examDate);


          // 入力欄をクリア
          document.getElementById("examDate").value = "";


          // 登録済み一覧を更新
          try {

            await loadExamDates();

          } catch (error) {

            console.error(
              "一覧更新エラー:",
              error
            );

          }


        } else if (result.status === "duplicate") {

          message.className =
            "message error";

          message.innerText =
            result.message ||
            "この検査日はすでに登録されています。";


          // 一覧を更新
          try {

            await loadExamDates();

          } catch (error) {

            console.error(error);

          }


        } else {

          message.className =
            "message error";

          message.innerText =
            "登録できませんでした。\n\n" +
            (result.message ||
             JSON.stringify(result));

        }


      } catch (error) {

        console.error(
          "登録エラー:",
          error
        );


        message.className =
          "message error";

        message.innerText =
          "登録に失敗しました。\n\n" +
          "エラー内容：\n" +
          getErrorMessage(error);

      }


      // ========================================
      // ボタンを元に戻す
      // ========================================

      button.disabled = false;

      button.innerText =
        "検査日を登録する";

    }


    // ========================================
    // 検査日変更
    // ========================================

    async function changeExam() {

      const oldExamDate =
        document.getElementById("changeDate").value;

      const newExamDate =
        document.getElementById("newExamDate").value;

      const button =
        document.getElementById("changeButton");

      const message =
        document.getElementById("changeMessage");


      // ========================================
      // 入力チェック
      // ========================================

      if (!oldExamDate) {

        message.className =
          "message error";

        message.innerText =
          "変更する検査日を選択してください。";

        return;

      }


      if (!newExamDate) {

        message.className =
          "message error";

        message.innerText =
          "新しい検査日を選択してください。";

        return;

      }


      if (!userId) {

        message.className =
          "message error";

        message.innerText =
          "LINEユーザー情報を取得できません。";

        return;

      }


      if (oldExamDate === newExamDate) {

        message.className =
          "message error";

        message.innerText =
          "変更前と変更後の検査日が同じです。";

        return;

      }


      button.disabled = true;

      button.innerText =
        "変更しています...";


      message.className =
        "message info";

      message.innerText =
        "検査日を変更しています...";


      try {

        const response =
          await fetch(
            GAS_URL,
            {
              method: "POST",

              headers: {
                "Content-Type": "text/plain"
              },

              body: JSON.stringify({
                action: "change",
                userId: userId,
                oldExamDate: oldExamDate,
                newExamDate: newExamDate
              })
            }
          );


        const responseText =
          await response.text();


        console.log(
          "GAS change response:",
          responseText
        );


        if (!responseText) {

          throw new Error(
            "GASから空の回答が返されました。"
          );

        }


        let result;

        try {

          result =
            JSON.parse(responseText);

        } catch (e) {

          throw new Error(
            "GASの回答をJSONとして読み取れませんでした。\n\n" +
            responseText
          );

        }


        if (result.status === "success") {

          message.className =
            "message success";

          message.innerText =
            "検査日を変更しました。\n\n" +
            "変更前： " +
            formatJapaneseDate(oldExamDate) +
            "\n" +
            "変更後： " +
            formatJapaneseDate(newExamDate);


          document.getElementById(
            "newExamDate"
          ).value = "";


          try {

            await loadExamDates();

          } catch (error) {

            console.error(error);

          }


        } else if (result.status === "duplicate") {

          message.className =
            "message error";

          message.innerText =
            result.message ||
            "変更後の検査日はすでに登録されています。";


        } else {

          message.className =
            "message error";

          message.innerText =
            "変更できませんでした。\n\n" +
            (result.message ||
             JSON.stringify(result));

        }


      } catch (error) {

        console.error(
          "変更エラー:",
          error
        );


        message.className =
          "message error";

        message.innerText =
          "変更に失敗しました。\n\n" +
          "エラー内容：\n" +
          getErrorMessage(error);

      }


      button.disabled = false;

      button.innerText =
        "検査日を変更する";

    }


    // ========================================
    // 日付表示
    // ========================================

    function formatJapaneseDate(dateString) {

      if (!dateString) {
        return "";
      }


      const parts =
        String(dateString).split("-");


      if (parts.length !== 3) {
        return String(dateString);
      }


      const year =
        parts[0];

      const month =
        Number(parts[1]);

      const day =
        Number(parts[2]);


      return (
        year +
        "年" +
        month +
        "月" +
        day +
        "日"
      );

    }


    // ========================================
    // 起動
    // ========================================

    window.addEventListener(
      "load",
      main
    );

  </script>

</body>

</html>
