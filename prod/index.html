<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>検査日登録・変更</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    body {
      font-family: sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
      background: #f7f7f7;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 25px;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    h2 {
      font-size: 20px;
      margin-top: 0;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input[type="date"] {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    button {
      padding: 10px 15px;
      font-size: 15px;
      border: none;
      border-radius: 8px;
      background: #06c755;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .register-button {
      width: 100%;
      padding: 13px;
      font-size: 16px;
      margin-top: 5px;
    }

    .date-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .date-item {
      border-bottom: 1px solid #eee;
      padding: 14px 0;
    }

    .date-item:last-child {
      border-bottom: none;
    }

    .date-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .date-text {
      font-size: 16px;
      font-weight: bold;
      flex: 1;
    }

 .change-button {
  background: #555;
  white-space: nowrap;
  padding: 8px 14px;
  font-size: 14px;
}

.cancel-exam-button {
  background: #d32f2f;
  white-space: nowrap;
  padding: 8px 14px;
  font-size: 14px;
}

    .change-area {
      margin-top: 12px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 8px;
    }

    .change-area input {
      margin-bottom: 10px;
    }

    .change-confirm-button {
      width: 100%;
      margin-top: 3px;
    }

    .cancel-button {
      width: 100%;
      margin-top: 8px;
      background: #999;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      white-space: pre-wrap;
      display: none;
    }

    .success {
      display: block;
      background: #e8f5e9;
      color: #2e7d32;
    }

    .error {
      display: block;
      background: #ffebee;
      color: #c62828;
    }

    .info {
      display: block;
      background: #e3f2fd;
      color: #1565c0;
    }

    .empty-message {
      color: #666;
      padding: 10px 0;
    }

  </style>

</head>


<body>

  <h1>検査日を登録・変更</h1>


  <!-- ========================= -->
  <!-- 登録済み検査日 -->
  <!-- ========================= -->

  <div class="box">

    <h2>登録されている検査日</h2>

    <div id="examList">
      読み込み中です...
    </div>

  </div>


  <!-- ========================= -->
  <!-- 新規登録 -->
  <!-- ========================= -->

  <div class="box">

    <h2>新しい検査日を登録</h2>

    <label for="examDate">
      検査日
    </label>

    <input
      type="date"
      id="examDate"
    >

    <button
      id="registerButton"
      class="register-button"
      onclick="registerExam()"
    >
      検査日を登録する
    </button>

    <div
      id="registerMessage"
      class="message"
    ></div>

  </div>


  <script>

    // ========================================
    // 設定
    // ========================================

    const LIFF_ID = "2011636967-XDwuMWl5";

    const GAS_URL =
      "https://script.google.com/macros/s/AKfycbxJtcX1kF2CfhTPHvoiK_aLIV6IAtUz3ypLA1V3LjEY7wdD-DYYntUUKd3WAJsC8cXR2w/exec";


    // ========================================
    // LINEユーザーID
    // ========================================

    let userId = "";


    // ========================================
    // 初期処理
    // ========================================

    async function main() {

      const registerMessage =
        document.getElementById("registerMessage");

      try {

        registerMessage.className =
          "message info";

        registerMessage.innerText =
          "LINE情報を確認しています...";


        await liff.init({
          liffId: LIFF_ID
        });


        if (!liff.isLoggedIn()) {

          liff.login();

          return;

        }


        const profile =
          await liff.getProfile();

        userId =
          profile.userId;


        console.log(
          "LINE userId:",
          userId
        );


        await loadExamDates();


        registerMessage.className =
          "message";

        registerMessage.innerText = "";


      } catch (error) {

        console.error(error);

        registerMessage.className =
          "message error";

        registerMessage.innerText =
          "初期化に失敗しました。\n\n" +
          getErrorMessage(error);

      }

    }


    // ========================================
    // エラー表示
    // ========================================

    function getErrorMessage(error) {

      if (!error) {
        return "原因不明のエラーです。";
      }

      if (error.message) {
        return error.message;
      }

      try {
        return JSON.stringify(error);
      } catch (e) {
        return String(error);
      }

    }


    // ========================================
    // 登録済み検査日を取得
    // ========================================

    async function loadExamDates() {

      const examList =
        document.getElementById("examList");


      if (!userId) {

        examList.innerText =
          "LINEユーザー情報を取得できませんでした。";

        return;

      }


      try {

        const response =
          await fetch(
            GAS_URL,
            {
              method: "POST",

              headers: {
                "Content-Type": "text/plain"
              },

              body: JSON.stringify({
                action: "get",
                userId: userId
              })
            }
          );


        const responseText =
          await response.text();


        console.log(
          "GAS response:",
          responseText
        );


        if (!responseText) {

          throw new Error(
            "GASから空の回答が返されました。"
          );

        }


        let result;

        try {

          result =
            JSON.parse(responseText);

        } catch (e) {

          throw new Error(
            "GASの回答をJSONとして読み取れませんでした。\n\n" +
            responseText
          );

        }


        if (result.status !== "success") {

          throw new Error(
            result.message ||
            "検査日取得でエラーが発生しました。"
          );

        }


        const dates =
          Array.isArray(result.dates)
            ? result.dates
            : [];


        // ========================================
        // 検査日一覧を表示
        // ========================================

        if (dates.length === 0) {

          examList.innerHTML =
            '<div class="empty-message">' +
            '現在、登録されている検査日はありません。' +
            '</div>';

          return;

        }


        examList.innerHTML = "";


        const ul =
          document.createElement("ul");

        ul.className =
          "date-list";


        dates.forEach(function(date) {

          const li =
            document.createElement("li");

          li.className =
            "date-item";


          // ========================================
          // 日付＋変更ボタン
          // ========================================

          const dateRow =
            document.createElement("div");

          dateRow.className =
            "date-row";


          const dateText =
            document.createElement("div");

          dateText.className =
            "date-text";

          dateText.innerText =
            formatJapaneseDate(date);


          const changeButton =
            document.createElement("button");

          changeButton.className =
            "change-button";

          changeButton.innerText =
            "変更";


          changeButton.onclick =
            function() {

              showChangeArea(
                li,
                date
              );

            };
const cancelExamButton =
  document.createElement("button");

cancelExamButton.className =
  "cancel-exam-button";

cancelExamButton.innerText =
  "取り消す";


cancelExamButton.onclick =
  function() {

    showCancelConfirm(
      li,
      date
    );

  };

          dateRow.appendChild(
            dateText
          );

          dateRow.appendChild(
  changeButton
);

dateRow.appendChild(
  cancelExamButton
);


          li.appendChild(
            dateRow
          );


          ul.appendChild(
            li
          );

        });


        examList.appendChild(
          ul
        );


      } catch (error) {

        console.error(error);

        examList.innerText =
          "検査日の取得に失敗しました。\n\n" +
          getErrorMessage(error);

        throw error;

      }

    }

// ========================================
// 検査日の取り消し確認
// ========================================

function showCancelConfirm(
  listItem,
  examDate
) {

  // すでに開いている確認画面を閉じる
  const existing =
    document.querySelector(
      ".cancel-area"
    );

  if (existing) {
    existing.remove();
  }


  // ========================================
  // 確認エリア
  // ========================================

  const cancelArea =
    document.createElement("div");

  cancelArea.className =
    "change-area cancel-area";


  const message =
    document.createElement("div");

  message.className =
    "message info";

  message.innerText =
    formatJapaneseDate(examDate) +
    "の検査日を取り消しますか？\n\n" +
    "取り消すと、この検査日のLINE通知も停止されます。";


  const confirmButton =
    document.createElement("button");

  confirmButton.className =
    "change-confirm-button";

  confirmButton.innerText =
    "この検査日を取り消す";


  const closeButton =
    document.createElement("button");

  closeButton.className =
    "cancel-button";

  closeButton.innerText =
    "キャンセル";


  // ========================================
  // 取り消し確定
  // ========================================

  confirmButton.onclick =
    async function() {

      await cancelExam(
        examDate,
        confirmButton,
        closeButton,
        message
      );

    };


  // ========================================
  // キャンセル
  // ========================================

  closeButton.onclick =
    function() {

      cancelArea.remove();

    };


  cancelArea.appendChild(
    message
  );

  cancelArea.appendChild(
    confirmButton
  );

  cancelArea.appendChild(
    closeButton
  );


  listItem.appendChild(
    cancelArea
  );

}


// ========================================
// 検査日の取り消し
// ========================================

async function cancelExam(
  examDate,
  confirmButton,
  closeButton,
  message
) {

  if (!userId) {

    message.className =
      "message error";

    message.innerText =
      "LINEユーザー情報を取得できません。";

    return;

  }


  confirmButton.disabled =
    true;

  closeButton.disabled =
    true;


  message.className =
    "message info";

  message.innerText =
    "検査日を取り消しています...";


  try {

    // ========================================
    // GASへ取り消しデータを送信
    // ========================================

    await fetch(
      GAS_URL,
      {
        method: "POST",

        mode: "no-cors",

        headers: {
          "Content-Type": "text/plain"
        },

        body: JSON.stringify({

          action: "cancel",

          userId: userId,

          examDate: examDate

        })

      }
    );


    // ========================================
    // 取り消し成功
    // ========================================

    message.className =
      "message success";

    message.innerText =
      "検査日を取り消しました。\n\n" +
      formatJapaneseDate(examDate) +
      "\n\n" +
      "この検査日のLINE通知は停止されます。";


    // 一覧を更新
    setTimeout(
      async function() {

        try {

          await loadExamDates();

        } catch (error) {

          console.error(error);

        }

      },
      800
    );


  } catch (error) {

    console.error(
      "取り消しエラー:",
      error
    );


    message.className =
      "message error";

    message.innerText =
      "検査日の取り消しに失敗しました。\n\n" +
      getErrorMessage(error);


    confirmButton.disabled =
      false;

    closeButton.disabled =
      false;

  }

}
    // ========================================
    // 変更画面を表示
    // ========================================

    function showChangeArea(
      listItem,
      oldExamDate
    ) {

      // すでに開いている変更画面を閉じる
      const existing =
        document.querySelector(
          ".change-area"
        );

      if (existing) {
        existing.remove();
      }


      // ========================================
      // 変更エリア
      // ========================================

      const changeArea =
        document.createElement("div");

      changeArea.className =
        "change-area";


      const label =
        document.createElement("label");

      label.innerText =
        "新しい検査日";


      const input =
        document.createElement("input");

      input.type =
        "date";

      input.className =
        "change-date-input";


      const confirmButton =
        document.createElement("button");

      confirmButton.className =
        "change-confirm-button";

      confirmButton.innerText =
        "この日付に変更する";


      const cancelButton =
        document.createElement("button");

      cancelButton.className =
        "cancel-button";

      cancelButton.innerText =
        "キャンセル";


      const message =
        document.createElement("div");

      message.className =
        "message";


      // ========================================
      // 変更ボタン
      // ========================================

      confirmButton.onclick =
        async function() {

          await changeExam(
            oldExamDate,
            input.value,
            confirmButton,
            cancelButton,
            message
          );

        };


      // ========================================
      // キャンセル
      // ========================================

      cancelButton.onclick =
        function() {

          changeArea.remove();

        };


      changeArea.appendChild(
        label
      );

      changeArea.appendChild(
        input
      );

      changeArea.appendChild(
        confirmButton
      );

      changeArea.appendChild(
        cancelButton
      );

      changeArea.appendChild(
        message
      );


      listItem.appendChild(
        changeArea
      );


      // 日付入力を自動で開く
      input.focus();

    }


    // ========================================
    // 検査日変更
    // ========================================

    async function changeExam(
      oldExamDate,
      newExamDate,
      confirmButton,
      cancelButton,
      message
    ) {


      // ========================================
      // 入力チェック
      // ========================================

      if (!newExamDate) {

        message.className =
          "message error";

        message.innerText =
          "新しい検査日を選択してください。";

        return;

      }


      if (oldExamDate === newExamDate) {

        message.className =
          "message error";

        message.innerText =
          "変更前と変更後の検査日が同じです。";

        return;

      }


      if (!userId) {

        message.className =
          "message error";

        message.innerText =
          "LINEユーザー情報を取得できません。";

        return;

      }


      confirmButton.disabled =
        true;

      cancelButton.disabled =
        true;


      message.className =
        "message info";

      message.innerText =
        "検査日を変更しています...";


      try {

        // ========================================
        // GASへ変更データを送信
        // ========================================

        await fetch(
          GAS_URL,
          {
            method: "POST",

            mode: "no-cors",

            headers: {
              "Content-Type": "text/plain"
            },

            body: JSON.stringify({

              action: "change",

              userId: userId,

              oldExamDate: oldExamDate,

              newExamDate: newExamDate

            })

          }
        );


        // ========================================
        // 変更成功
        // ========================================

        message.className =
          "message success";

        message.innerText =
          "検査日を変更しました。\n\n" +
          "変更前： " +
          formatJapaneseDate(oldExamDate) +
          "\n" +
          "変更後： " +
          formatJapaneseDate(newExamDate);


        // 少し待って一覧を更新
        setTimeout(
          async function() {

            try {

              await loadExamDates();

            } catch (error) {

              console.error(error);

            }

          },
          800
        );


      } catch (error) {

        console.error(
          "変更エラー:",
          error
        );


        message.className =
          "message error";

        message.innerText =
          "検査日の変更に失敗しました。\n\n" +
          getErrorMessage(error);

        confirmButton.disabled =
          false;

        cancelButton.disabled =
          false;

      }

    }


    // ========================================
    // 新規検査日登録
    // ========================================

    async function registerExam() {

      const examDate =
        document.getElementById("examDate").value;

      const button =
        document.getElementById(
          "registerButton"
        );

      const message =
        document.getElementById(
          "registerMessage"
        );


      if (!examDate) {

        message.className =
          "message error";

        message.innerText =
          "検査日を選択してください。";

        return;

      }


      if (!userId) {

        message.className =
          "message error";

        message.innerText =
          "LINEユーザー情報を取得できません。\n" +
          "LINEからもう一度開いてください。";

        return;

      }


      button.disabled =
        true;

      button.innerText =
        "登録しています...";


      message.className =
        "message info";

      message.innerText =
        "検査日を登録しています...";


      try {

        // ========================================
        // GASへ登録
        // ========================================

        await fetch(
          GAS_URL,
          {
            method: "POST",

            mode: "no-cors",

            headers: {
              "Content-Type": "text/plain"
            },

            body: JSON.stringify({

              action: "add",

              userId: userId,

              examDate: examDate

            })

          }
        );


        // ========================================
        // 登録成功
        // ========================================

        message.className =
          "message success";

        message.innerText =
          "検査日を登録しました。\n\n" +
          formatJapaneseDate(examDate) +
          "\n\n" +
          "検査日の5日前と前日にLINEでお知らせします。";


        document.getElementById(
          "examDate"
        ).value = "";


        // 一覧更新
        setTimeout(
          async function() {

            try {

              await loadExamDates();

            } catch (error) {

              console.error(error);

            }

          },
          500
        );


      } catch (error) {

        console.error(
          "登録エラー:",
          error
        );


        message.className =
          "message error";

        message.innerText =
          "登録に失敗しました。\n\n" +
          "ただし、スプレッドシートに登録されている場合は、" +
          "登録処理自体は成功しています。";

      }


      button.disabled =
        false;

      button.innerText =
        "検査日を登録する";

    }


    // ========================================
    // 日付表示
    // ========================================

    function formatJapaneseDate(
      dateString
    ) {

      if (!dateString) {
        return "";
      }


      const parts =
        String(dateString).split("-");


      if (parts.length !== 3) {
        return String(dateString);
      }


      const year =
        parts[0];

      const month =
        Number(parts[1]);

      const day =
        Number(parts[2]);


      return (
        year +
        "年" +
        month +
        "月" +
        day +
        "日"
      );

    }


    // ========================================
    // 起動
    // ========================================

    window.addEventListener(
      "load",
      main
    );

  </script>

</body>

</html>
