<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>検査日のお知らせ</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
      background: #f7f7f7;
      color: #333;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 25px;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    input[type="date"] {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 18px;
      margin: 10px 0 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      font-size: 17px;
      border: none;
      border-radius: 8px;
      background: #06c755;
      color: white;
      cursor: pointer;
      margin-top: 8px;
    }

    button:disabled {
      background: #aaa;
    }

    .change-button {
      background: #777;
    }

    .message {
      margin-top: 15px;
      padding: 10px;
      text-align: center;
      white-space: pre-wrap;
    }

    .error {
      color: #d00;
    }

    .success {
      color: #008000;
    }

    .exam-date {
      padding: 12px;
      margin: 8px 0;
      background: #f0f0f0;
      border-radius: 6px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <h1>検査日のお知らせ</h1>

  <div class="box">
    <h2>検査日の登録</h2>

    <p>
      検査日を入力してください。
    </p>

    <input type="date" id="examDate">

    <button id="registerButton" onclick="registerExam()">
      この検査日を登録する
    </button>

    <div id="message" class="message"></div>
  </div>


  <div class="box">
    <h2>登録済みの検査日</h2>

    <div id="dateList">
      読み込み中です…
    </div>

    <div id="changeArea" class="hidden">

      <h3>検査日を変更する</h3>

      <input type="date" id="newExamDate">

      <button class="change-button" onclick="changeExam()">
        検査日を変更する
      </button>

      <div id="changeMessage" class="message"></div>

    </div>
  </div>


  <script>

    // ========================================
    // 設定
    // ========================================

    const LIFF_ID = "2011636967-XDwuMWl5";

    const GAS_URL =
      "https://script.google.com/macros/s/AKfycbxJtcX1kF2CfhTPHvoiK_aLIV6IAtUz3ypLA1V3LjEY7wdD-DYYntUUKd3WAJsC8cXR2w/exec";


    // 現在のLINEユーザーID
    let userId = "";

    // 変更対象の検査日
    let oldExamDate = "";


    // ========================================
    // 初期処理
    // ========================================

    async function main() {

      const message =
        document.getElementById("message");

      try {

        message.innerText =
          "読み込み中です…";


        // LIFF初期化
        await liff.init({
          liffId: LIFF_ID
        });


        // LINEログイン確認
        if (!liff.isLoggedIn()) {

          liff.login();

          return;
        }


        // LINEプロフィール取得
        const profile =
          await liff.getProfile();

        userId =
          profile.userId;


        // 登録済み検査日の取得
        await loadExamDates();


        message.innerText = "";


      } catch (error) {

        console.error(error);

        message.className =
          "message error";

        message.innerText =
          "初期化に失敗しました。\n" +
          error.message;
      }
    }


    // ========================================
    // 登録済み検査日の取得
    // ========================================

    async function loadExamDates() {

      const dateList =
        document.getElementById("dateList");


      try {

        const response =
          await fetch(GAS_URL, {

            method: "POST",

            headers: {
              "Content-Type": "text/plain"
            },

            body: JSON.stringify({

              action: "get",

              userId: userId

            })

          });


        // GASからの回答を文字列として取得
        const text =
          await response.text();


        console.log(
          "GAS response:",
          text
        );


        let result;


        try {

          result =
            JSON.parse(text);

        } catch (e) {

          throw new Error(
            "GASからJSONではない回答が返りました。\n\n" +
            text
          );
        }


        // ★ GASの返却形式に合わせる
        if (result.status !== "success") {

          throw new Error(
            result.message ||
            "登録済み検査日の取得に失敗しました。"
          );
        }


        // ★ GASでは dates という名前で返ってくる
        displayExamDates(
          result.dates || []
        );


      } catch (error) {

        console.error(error);

        dateList.innerHTML =
          '<div class="error">' +
          "登録済み検査日の取得に失敗しました。<br><br>" +
          error.message.replace(/\n/g, "<br>") +
          "</div>";
      }
    }


    // ========================================
    // 登録済み検査日の表示
    // ========================================

    function displayExamDates(examDates) {

      const dateList =
        document.getElementById("dateList");


      // 登録なし
      if (
        !examDates ||
        examDates.length === 0
      ) {

        dateList.innerHTML =
          "現在、登録されている検査日はありません。";

        return;
      }


      dateList.innerHTML = "";


      examDates.forEach(function(date) {

        const div =
          document.createElement("div");

        div.className =
          "exam-date";

        div.innerText =
          "検査日： " +
          formatDate(date);

        dateList.appendChild(div);

      });


      // 最初の検査日を変更対象にする
      showChangeArea(
        examDates[0]
      );
    }


    // ========================================
    // 検査日を登録
    // ========================================

    async function registerExam() {

      const examDate =
        document.getElementById("examDate").value;

      const message =
        document.getElementById("message");

      const button =
        document.getElementById("registerButton");


      // 入力確認
      if (!examDate) {

        message.className =
          "message error";

        message.innerText =
          "検査日を入力してください。";

        return;
      }


      try {

        button.disabled = true;

        message.className =
          "message";

        message.innerText =
          "登録しています…";


        // GASへ送信
        const response =
          await fetch(GAS_URL, {

            method: "POST",

            headers: {
              "Content-Type": "text/plain"
            },

            body: JSON.stringify({

              action: "add",

              userId: userId,

              examDate: examDate

            })

          });


        // GASからの回答
        const text =
          await response.text();


        console.log(
          "GAS register response:",
          text
        );


        let result;


        try {

          result =
            JSON.parse(text);

        } catch (e) {

          throw new Error(
            "GASからJSONではない回答が返りました。\n\n" +
            text
          );
        }


        // ★ GASの返却形式に合わせる
      if (result.status === "success") {

  message.className =
    "message success";

  message.innerText =
    "検査日を登録しました。";

  document.getElementById(
    "examDate"
  ).value = "";

  // 登録済み検査日は後から読み込む
  try {
    await loadExamDates();
  } catch (e) {
    console.error(e);
  }

} else {

  message.className =
    "message error";

  message.innerText =
    "GASからエラーが返されました。\n\n" +
    (result.message || JSON.stringify(result));
}


      } catch (error) {

        console.error(error);

        message.className =
          "message error";

        message.innerText =
          "登録に失敗しました。\n\n" +
          error.message;


      } finally {

        button.disabled = false;
      }
    }


    // ========================================
    // 変更エリア表示
    // ========================================

    function showChangeArea(date) {

      oldExamDate = date;

      const area =
        document.getElementById(
          "changeArea"
        );

      area.classList.remove(
        "hidden"
      );
    }


    // ========================================
    // 変更対象の日付を選択
    // ========================================

    function selectChangeDate(date) {

      oldExamDate = date;

      document.getElementById(
        "newExamDate"
      ).value = "";
    }


    // ========================================
    // 検査日を変更
    // ========================================

    async function changeExam() {

      const newExamDate =
        document.getElementById(
          "newExamDate"
        ).value;

      const message =
        document.getElementById(
          "changeMessage"
        );


      // 入力確認
      if (!newExamDate) {

        message.className =
          "message error";

        message.innerText =
          "変更後の検査日を入力してください。";

        return;
      }


      // 変更対象確認
      if (!oldExamDate) {

        message.className =
          "message error";

        message.innerText =
          "変更する検査日が確認できません。";

        return;
      }


      try {

        message.className =
          "message";

        message.innerText =
          "変更しています…";


        // GASへ送信
        const response =
          await fetch(GAS_URL, {

            method: "POST",

            headers: {
              "Content-Type": "text/plain"
            },

            body: JSON.stringify({

              action: "change",

              userId: userId,

              oldExamDate: oldExamDate,

              newExamDate: newExamDate

            })

          });


        // GASからの回答
        const text =
          await response.text();


        console.log(
          "GAS change response:",
          text
        );


        let result;


        try {

          result =
            JSON.parse(text);

        } catch (e) {

          throw new Error(
            "GASからJSONではない回答が返りました。\n\n" +
            text
          );
        }


        // ★ GASの返却形式に合わせる
        if (result.status !== "success") {

          throw new Error(
            result.message ||
            "GAS側で変更に失敗しました。"
          );
        }


        // ========================================
        // 変更成功
        // ========================================

        message.className =
          "message success";

        message.innerText =
          "検査日を変更しました。";


        // 入力欄をクリア
        document.getElementById(
          "newExamDate"
        ).value = "";


        // 登録済み検査日を再読み込み
        await loadExamDates();


      } catch (error) {

        console.error(error);

        message.className =
          "message error";

        message.innerText =
          "変更に失敗しました。\n\n" +
          error.message;
      }
    }


    // ========================================
    // 日付表示
    // ========================================

    function formatDate(dateString) {

      if (!dateString) {
        return "";
      }


      const parts =
        dateString.split("-");


      if (parts.length !== 3) {
        return dateString;
      }


      return (
        parts[0] +
        "年" +
        Number(parts[1]) +
        "月" +
        Number(parts[2]) +
        "日"
      );
    }


    // ========================================
    // 開始
    // ========================================

    main();

  </script>

</body>
</html>
