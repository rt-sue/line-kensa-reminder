<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>検査リマインド QR開発</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>

<body>

<h1>検査リマインド QR開発</h1>

<div id="status">初期化しています...</div>

<script>

const LIFF_ID = "2011636967-BdVceko1";

async function main() {

  const status = document.getElementById("status");

  try {

    status.innerText = "① LIFF初期化開始";

    await liff.init({
      liffId: LIFF_ID
    });

    status.innerText =
      "② LIFF初期化成功\n\n" +
      "LIFF ID: " + LIFF_ID;

  } catch (error) {

    console.error(error);

    status.innerText =
      "❌ LIFF初期化エラー\n\n" +
      (error.message || String(error));

  }

}

window.addEventListener("load", main);

</script>

</body>
</html>
