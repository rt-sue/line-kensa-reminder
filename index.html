<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>検査リマインド</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 30px 20px;
      background: #f7f7f7;
    }

    h1 {
      text-align: center;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 10px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background: #06c755;
      color: white;
    }

    button:disabled {
      background: #999;
    }

    #message {
      margin-top: 20px;
      text-align: center;
    }
  </style>
</head>

<body>

  <h1>検査リマインド</h1>

  <div class="box">

    <label for="examDate">検査日</label>

    <input
      type="date"
      id="examDate"
    >

    <button id="registerButton" onclick="registerExam()">検査日を登録・変更</button>

    <div id="message"></div>

  </div>

<script>

const LIFF_ID = "2011561246-fTeZ3OYX";

/* ここにGASのWebアプリURLを入れてください */
const GAS_URL = "https://script.google.com/macros/s/AKfycbxJtcX1kF2CfhTPHvoiK_aLIV6IAtUz3ypLA1V3LjEY7wdD-DYYntUUKd3WAJsC8cXR2w/exec";


let userId = "";


async function main() {
  try {

    await liff.init({ liffId: LIFF_ID });

    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    // 友だち追加を確認・要求
    try {
  await liff.requestFriendship();
} catch (friendshipError) {

  console.error("友だち追加エラー：", friendshipError);

  document.getElementById("message").innerText =
    "友だち追加処理でエラーが発生しました。\n" +
    "エラー：" + friendshipError.message;
}

    const profile = await liff.getProfile();

    userId = profile.userId;

  } catch (error) {

    document.getElementById("message").innerText =
      "LINEとの接続に失敗しました。";

    console.error(error);
  }
}

async function registerExam() {

  const examDate =
    document.getElementById("examDate").value;

  const message =
    document.getElementById("message");

  const button =
    document.getElementById("registerButton");


  if (!examDate) {

    message.innerText =
      "検査日を入力してください。";

    return;

  }


  if (!userId) {

    message.innerText =
      "LINEユーザー情報を取得できませんでした。";

    return;

  }


  button.disabled = true;

  message.innerText =
    "登録しています……";


  try {

    const response = await fetch(GAS_URL, {

      method: "POST",

      headers: {
        "Content-Type": "text/plain"
      },

      body: JSON.stringify({
        userId: userId,
        examDate: examDate
      })

    });


    const result = await response.json();


    if (result.status === "success") {

      message.innerText =
        "検査日を登録しました。";

    } else {

      throw new Error(result.message);

    }


  } catch (error) {

    console.error(error);

    message.innerText =
      "登録に失敗しました。";

  }


  button.disabled = false;

}


main();

</script>

</body>
</html>
